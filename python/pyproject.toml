[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monols"
version = "2.0.0.dev0"
description = "Shape-constrained least squares: monotone, convex/concave and k-monotone fits"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
test = ["pytest", "scipy", "scikit-learn"]

[tool.hatch.build.targets.wheel]
packages = ["src/monols"]

[tool.pytest.ini_options]
testpaths = ["tests"]
